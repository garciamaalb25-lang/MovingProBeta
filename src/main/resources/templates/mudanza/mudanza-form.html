<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Formulario Mudanza - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/validaciones.js}"></script>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="main-content">
		<div class="content-area">
			<p class="page-title" th:text="${mudanza.idMudanza == null} ? 'Nueva Mudanza' : 'Editar Mudanza'"></p>
			<p class="page-subtitle">Completa los datos del formulario</p>
			<div class="form-card">
				<div class="form-card-header">
					<h6 class="card-header-title">
						<i class="bi bi-box-seam me-2"></i>Datos de la mudanza
					</h6>
				</div>
				<div class="form-card-body">
					<div class="info-box">
						<p><i class="bi bi-info-circle me-2"></i>El coste se calculará automáticamente al asignar un
							vehículo según las horas y el coste por hora del vehículo.</p>
					</div>
					<form th:action="@{/mudanza/save}" th:object="${mudanza}" method="post">
						<input type="hidden" th:field="*{idMudanza}" />
						<input type="hidden" th:field="*{coste}" />
						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label">Código</label>
								<input type="number" min="1" max="99999" class="form-control" th:field="*{codigo}"
									required th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}"
									th:errors="*{codigo}"></div>
								<div class="form-text">Entre 1 y 99999</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Fecha</label>
								<input type="date" class="form-control" th:name="fecha"
									th:value="${mudanza.fecha != null ? #temporals.format(mudanza.fecha, 'yyyy-MM-dd') : ''}"
									required th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}"
									th:errors="*{fecha}"></div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Origen</label>
								<input type="text" minlength="3" maxlength="100" class="form-control"
									th:field="*{origen}" required placeholder="Ciudad de origen"
									th:classappend="${#fields.hasErrors('origen')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('origen')}"
									th:errors="*{origen}"></div>
								<div class="form-text">Entre 3 y 100 caracteres</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Destino</label>
								<input type="text" minlength="3" maxlength="100" class="form-control"
									th:field="*{destino}" required placeholder="Ciudad de destino"
									th:classappend="${#fields.hasErrors('destino')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('destino')}"
									th:errors="*{destino}"></div>
								<div class="form-text">Entre 3 y 100 caracteres</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Número de Horas</label>
								<input type="number" min="1" max="720" class="form-control" th:field="*{numeroHoras}"
									id="numeroHoras" required
									th:classappend="${#fields.hasErrors('numeroHoras')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('numeroHoras')}"
									th:errors="*{numeroHoras}"></div>
								<div class="form-text">Entre 1 y 720 horas</div>
							</div>
						</div>
						<div class="mt-4 d-flex gap-3">
							<button type="submit" class="btn-guardar">
								<i class="bi bi-check-circle me-1"></i>Guardar
							</button>
							<a th:href="@{/mudanza}" class="btn-cancelar">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/navbar :: mobilenav}"></div>
</body>

</html>
