<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Mudanza</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4">

        <h2 class="mb-4" th:text="${mudanza.idMudanza == null} ? 'Nueva Mudanza' : 'Editar Mudanza'"></h2>

        <form th:action="@{/mudanza/save}" th:object="${mudanza}" method="post">

            <input type="hidden" th:field="*{idMudanza}" />

            <div class="mb-3">
                <label class="form-label">Código</label>
                <input type="number" class="form-control" th:field="*{codigo}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Origen</label>
                <input type="text" class="form-control" th:field="*{origen}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Destino</label>
                <input type="text" class="form-control" th:field="*{destino}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Coste (€)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{coste}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Número de Horas</label>
                <input type="number" class="form-control" th:field="*{numeroHoras}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" th:field="*{fecha}" />
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/mudanza}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
