<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Listado de Mudanzas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        
        <h2 class="mb-4">Listado de Mudanzas</h2>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/mudanza/new}" class="btn btn-primary mb-3">Nueva Mudanza</a>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Origen</th>
                    <th>Destino</th>
                    <th>Coste</th>
                    <th>Horas</th>
                    <th>Fecha</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="mudanza : ${mudanzas}">
                    <td th:text="${mudanza.codigo}"></td>
                    <td th:text="${mudanza.origen}"></td>
                    <td th:text="${mudanza.destino}"></td>
                    <td th:text="${mudanza.coste} + ' €'"></td>
                    <td th:text="${mudanza.numeroHoras}"></td>
                    <td th:text="${#temporals.format(mudanza.fecha, 'dd/MM/yyyy')}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/mudanza/edit/{id}(id=${mudanza.idMudanza})}" 
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/mudanza/delete/{id}(id=${mudanza.idMudanza})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar esta mudanza?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
