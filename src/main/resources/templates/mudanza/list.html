<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Mudanzas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4 flex-grow-1">
        <h2 class="mb-4">Listado de Mudanzas</h2>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/mudanza/new}" class="btn btn-primary mb-3">Nueva Mudanza</a>

        <div class="card bg-dark border-secondary mb-4">
            <div class="card-body">
                <h5 class="card-title text-white mb-3">
                    <i class="bi bi-search"></i> Buscar por fecha
                </h5>
                <form th:action="@{/mudanza/buscar}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label text-white">Fecha exacta</label>
                        <input type="date" class="form-control" name="fecha" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white">Fecha inicio</label>
                        <input type="date" class="form-control" name="fechaInicio" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white">Fecha fin</label>
                        <input type="date" class="form-control" name="fechaFin" />
                    </div>
                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-danger">Buscar</button>
                        <a th:href="@{/mudanza}" class="btn btn-secondary">Limpiar</a>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Código</th>
                    <th>Origen</th>
                    <th>Destino</th>
                    <th>Coste</th>
                    <th>Horas</th>
                    <th>Fecha</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="mudanza : ${mudanzas}">
                    <td th:text="${mudanza.codigo}"></td>
                    <td th:text="${mudanza.origen}"></td>
                    <td th:text="${mudanza.destino}"></td>
                    <td th:text="${mudanza.coste} + ' €'"></td>
                    <td th:text="${mudanza.numeroHoras}"></td>
                    <td th:text="${#temporals.format(mudanza.fecha, 'dd/MM/yyyy')}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/mudanza/edit/{id}(id=${mudanza.idMudanza})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/mudanza/delete/{id}(id=${mudanza.idMudanza})}"
                           class="btn btn-danger btn-sm btn-eliminar">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="modalConfirmar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-danger">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle text-danger"></i> Confirmar eliminación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que quieres eliminar este registro? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/validaciones.js}"></script>
</body>
</html>
