<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Operarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4">

        <h2 class="mb-4">Listado de Operarios</h2>

        <a th:href="@{/operario/new}" class="btn btn-primary mb-3">Nuevo Operario</a>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Experiencia (años)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="operario : ${operarios}">
                    <td th:text="${operario.nombre}"></td>
                    <td th:text="${operario.experiencia}"></td>
                    <td>
                        <a th:href="@{/operario/edit/{id}(id=${operario.idOperario})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/operario/delete/{id}(id=${operario.idOperario})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar este operario?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
