<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Operarios - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<style>
		body {
			background: #F4F7FB;
			font-family: 'Segoe UI', sans-serif;
			margin: 0;
		}

		.main-content {
			margin-left: 250px;
			padding-top: 60px;
			min-height: 100vh;
		}

		.content-area {
			padding: 30px;
		}

		.page-title {
			font-size: 22px;
			font-weight: 700;
			color: #1B3A6B;
			margin-bottom: 4px;
		}

		.page-subtitle {
			color: #378ADD;
			font-size: 13px;
			margin-bottom: 24px;
		}

		.card-table {
			background: #ffffff;
			border-radius: 12px;
			border: 0.5px solid #B5D4F4;
			overflow: hidden;
		}

		.card-header-custom {
			padding: 20px 24px;
			border-bottom: 0.5px solid #B5D4F4;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.search-area {
			padding: 16px 24px;
			background: #F4F7FB;
			border-bottom: 0.5px solid #B5D4F4;
		}

		.search-area label {
			color: #1B3A6B;
			font-size: 12px;
			font-weight: 600;
		}

		table thead th {
			background: #F4F7FB;
			color: #1B3A6B;
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 1px;
			border: none;
			padding: 12px 16px;
		}

		table tbody td {
			padding: 12px 16px;
			font-size: 14px;
			border-bottom: 0.5px solid #F4F7FB;
		}

		table tbody tr:hover {
			background: #F4F7FB;
		}

		.btn-editar {
			background: #FAEEDA;
			color: #854F0B;
			border: none;
			font-size: 12px;
			padding: 4px 12px;
			border-radius: 6px;
			text-decoration: none;
		}

		.btn-eliminar-custom {
			background: #FCEBEB;
			color: #A32D2D;
			border: none;
			font-size: 12px;
			padding: 4px 12px;
			border-radius: 6px;
			cursor: pointer;
		}

		.btn-nuevo {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			font-size: 13px;
			padding: 8px 18px;
			border-radius: 8px;
			text-decoration: none;
		}

		.btn-nuevo:hover {
			background: #2A5298;
			color: #E6F1FB;
		}

		.btn-buscar {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			padding: 6px 16px;
			border-radius: 6px;
			font-size: 13px;
		}

		.btn-limpiar {
			background: #ffffff;
			color: #1B3A6B;
			border: 0.5px solid #B5D4F4;
			padding: 6px 16px;
			border-radius: 6px;
			font-size: 13px;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="main-content">
		<div class="content-area">
			<p class="page-title">Operarios</p>
			<p class="page-subtitle">Gestión del equipo de operarios</p>
			<div class="card-table">
				<div class="card-header-custom">
					<h6 style="color: #1B3A6B; font-weight: 700; margin: 0; font-size: 15px;"><i
							class="bi bi-people me-2"></i>Listado de operarios</h6>
					<a sec:authorize="hasRole('ADMIN')" th:href="@{/operario/new}" class="btn-nuevo"><i
							class="bi bi-plus-circle me-1"></i>Nuevo Operario</a>
				</div>
				<div class="search-area">
					<form th:action="@{/operario/buscar}" method="get" class="row g-2 align-items-end">
						<div class="col-md-4">
							<label class="form-label">Experiencia mínima (años)</label>
							<input type="number" class="form-control form-control-sm" name="experienciaMinima" min="0"
								max="50" />
						</div>
						<div class="col-md-4 d-flex gap-2">
							<button type="submit" class="btn-buscar">Buscar</button>
							<a th:href="@{/operario}" class="btn-limpiar">Limpiar</a>
						</div>
					</form>
				</div>
				<table class="table mb-0">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Experiencia (años)</th>
							<th sec:authorize="hasRole('ADMIN')">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="operario : ${operarios}">
							<td th:text="${operario.nombre}"></td>
							<td th:text="${operario.experiencia}"></td>
							<td sec:authorize="hasRole('ADMIN')">
								<a th:href="@{/operario/edit/{id}(id=${operario.idOperario})}"
									class="btn-editar">Editar</a>
								<a th:href="@{/operario/delete/{id}(id=${operario.idOperario})}"
									class="btn-eliminar-custom btn-eliminar ms-1">Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(operarios)}">
							<td colspan="3" style="text-align: center; color: #B5D4F4; padding: 24px;">No hay operarios
								registrados</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<div class="modal fade" id="modalConfirmar" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header" style="background: #1B3A6B;">
					<h5 class="modal-title" style="color: #E6F1FB;"><i
							class="bi bi-exclamation-triangle text-warning me-2"></i>Confirmar eliminación</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">¿Estás seguro de que quieres eliminar este registro?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/navbar :: mobilenav}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/validaciones.js}"></script>
</body>

</html>
