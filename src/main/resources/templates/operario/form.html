<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Formulario Operario - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<style>
		body {
			background: #F4F7FB;
			font-family: 'Segoe UI', sans-serif;
			margin: 0;
		}

		.main-content {
			margin-left: 250px;
			padding-top: 60px;
			min-height: 100vh;
		}

		.content-area {
			padding: 30px;
		}

		.page-title {
			font-size: 22px;
			font-weight: 700;
			color: #1B3A6B;
			margin-bottom: 4px;
		}

		.page-subtitle {
			color: #378ADD;
			font-size: 13px;
			margin-bottom: 24px;
		}

		.form-card {
			background: #ffffff;
			border-radius: 12px;
			border: 0.5px solid #B5D4F4;
			overflow: hidden;
		}

		.form-card-header {
			padding: 20px 24px;
			border-bottom: 0.5px solid #B5D4F4;
		}

		.form-card-body {
			padding: 24px;
		}

		.form-label {
			color: #1B3A6B;
			font-size: 13px;
			font-weight: 600;
		}

		.form-text {
			color: #378ADD;
			font-size: 11px;
		}

		.btn-guardar {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
		}

		.btn-guardar:hover {
			background: #2A5298;
			color: #E6F1FB;
		}

		.btn-cancelar {
			background: #F4F7FB;
			color: #1B3A6B;
			border: 0.5px solid #B5D4F4;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="main-content">
		<div class="content-area">
			<p class="page-title" th:text="${operario.idOperario == null} ? 'Nuevo Operario' : 'Editar Operario'"></p>
			<p class="page-subtitle">Completa los datos del formulario</p>
			<div class="form-card">
				<div class="form-card-header">
					<h6 style="color: #1B3A6B; font-weight: 700; margin: 0; font-size: 15px;"><i
							class="bi bi-person me-2"></i>Datos del operario</h6>
				</div>
				<div class="form-card-body">
					<form th:action="@{/operario/save}" th:object="${operario}" method="post">
						<input type="hidden" th:field="*{idOperario}" />
						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label">Nombre</label>
								<input type="text" minlength="2" maxlength="50" class="form-control"
									th:field="*{nombre}" required placeholder="Nombre del operario"
									th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
									th:errors="*{nombre}"></div>
								<div class="form-text">Entre 2 y 50 caracteres</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Experiencia (años)</label>
								<input type="number" min="0" max="50" class="form-control" th:field="*{experiencia}"
									required th:classappend="${#fields.hasErrors('experiencia')} ? 'is-invalid'" />
								<div class="invalid-feedback" th:if="${#fields.hasErrors('experiencia')}"
									th:errors="*{experiencia}"></div>
								<div class="form-text">Entre 0 y 50 años</div>
							</div>
						</div>
						<div class="mt-4 d-flex gap-3">
							<button type="submit" class="btn-guardar"><i
									class="bi bi-check-circle me-1"></i>Guardar</button>
							<a th:href="@{/operario}" class="btn-cancelar">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/navbar :: mobilenav}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/validaciones.js}"></script>
</body>

</html>
