<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Operario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4">

        <h2 class="mb-4" th:text="${operario.idOperario == null} ? 'Nuevo Operario' : 'Editar Operario'"></h2>

        <form th:action="@{/operario/save}" th:object="${operario}" method="post">

            <input type="hidden" th:field="*{idOperario}" />

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Experiencia (años)</label>
                <input type="number" class="form-control" th:field="*{experiencia}" />
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/operario}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
