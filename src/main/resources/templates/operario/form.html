<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Operario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4">
        <h2 class="mb-4" th:text="${operario.idOperario == null} ? 'Nuevo Operario' : 'Editar Operario'"></h2>
        <form th:action="@{/operario/save}" th:object="${operario}" method="post">
            <input type="hidden" th:field="*{idOperario}" />
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" minlength="2" maxlength="50" class="form-control" th:field="*{nombre}"
                       required placeholder="Nombre del operario"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                     th:errors="*{nombre}"></div>
                <div class="form-text">Entre 2 y 50 caracteres</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Experiencia (años)</label>
                <input type="number" min="0" max="50" class="form-control" th:field="*{experiencia}"
                       required
                       th:classappend="${#fields.hasErrors('experiencia')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('experiencia')}"
                     th:errors="*{experiencia}"></div>
                <div class="form-text">Entre 0 y 50 años</div>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/operario}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
