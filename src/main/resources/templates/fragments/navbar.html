<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
	<div th:fragment="navbar"
		style="position: fixed; top: 0; left: 250px; right: 0; height: 60px; background: #ffffff; border-bottom: 0.5px solid #B5D4F4; z-index: 99; display: flex; align-items: center; justify-content: space-between; padding: 0 30px;">

		<div style="display: flex; align-items: center; gap: 8px;">
			<i class="bi bi-speedometer2" style="color: #1B3A6B; font-size: 18px;"></i>
			<span style="color: #1B3A6B; font-size: 15px; font-weight: 600;" id="pageTitle">Panel de control</span>
		</div>

		<div style="display: flex; align-items: center; gap: 16px;">
			<div style="display: flex; align-items: center; gap: 8px;">
				<span
					style="background: #E6F1FB; color: #1B3A6B; font-size: 12px; padding: 4px 12px; border-radius: 20px;"
					sec:authorize="hasRole('ADMIN')">
					<i class="bi bi-shield-check me-1"></i>Admin
				</span>
				<span
					style="background: #E1F5EE; color: #085041; font-size: 12px; padding: 4px 12px; border-radius: 20px;"
					sec:authorize="hasRole('OPERADOR')">
					<i class="bi bi-person-check me-1"></i>Operador
				</span>
			</div>
			<span style="color: #1B3A6B; font-size: 14px; font-weight: 600;" sec:authentication="name"></span>
		</div>
	</div>
</body>

</html>
