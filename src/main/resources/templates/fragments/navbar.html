<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
	<div th:fragment="navbar" id="topNavbar" class="top-navbar">
		<div class="d-flex align-items-center gap-2">
			<i class="bi bi-speedometer2 navbar-brand-icon"></i>
			<span class="navbar-brand-text">Panel de control</span>
		</div>

		<div class="d-flex align-items-center gap-3">
			<span class="role-badge-admin" sec:authorize="hasRole('ADMIN')">
				<i class="bi bi-shield-check me-1"></i>Admin
			</span>
			<span class="role-badge-operador" sec:authorize="hasRole('OPERADOR')">
				<i class="bi bi-person-check me-1"></i>Operador
			</span>
		</div>
	</div>

	<div th:fragment="mobilenav" class="mobile-nav d-flex d-md-none">
		<a th:href="@{/}" class="mobile-nav-link active">
			<i class="bi bi-speedometer2"></i>Inicio
		</a>
		<a th:href="@{/mudanza}" class="mobile-nav-link">
			<i class="bi bi-box-seam"></i>Mudanzas
		</a>
		<a th:href="@{/vehiculo}" class="mobile-nav-link">
			<i class="bi bi-truck"></i>Vehículos
		</a>
		<a th:href="@{/operario}" class="mobile-nav-link">
			<i class="bi bi-people"></i>Operarios
		</a>
		<a th:href="@{/mudanzavehiculo}" class="mobile-nav-link">
			<i class="bi bi-link-45deg"></i>Asignar
		</a>
	</div>
</body>

</html>
