<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
	<div id="mainSidebar" th:fragment="sidebar" class="main-sidebar d-none d-md-flex">

		<div class="sidebar-header">
			<div class="d-flex align-items-center gap-2">
				<i class="bi bi-truck sidebar-brand-icon"></i>
				<span class="sidebar-brand-text">MovingPro</span>
			</div>
			<p class="sidebar-brand-subtitle">Gestión de mudanzas</p>
		</div>

		<nav class="sidebar-nav">
			<p class="sidebar-label">Principal</p>

			<a th:href="@{/}" class="sidebar-link">
				<i class="bi bi-speedometer2 sidebar-link-icon highlight"></i>
				<span>Dashboard</span>
			</a>

			<p class="sidebar-label-sec">Gestión</p>

			<a th:href="@{/mudanza}" class="sidebar-link">
				<i class="bi bi-box-seam sidebar-link-icon"></i>
				<span>Mudanzas</span>
			</a>

			<a th:href="@{/vehiculo}" class="sidebar-link">
				<i class="bi bi-truck sidebar-link-icon"></i>
				<span>Vehículos</span>
			</a>

			<a th:href="@{/operario}" class="sidebar-link">
				<i class="bi bi-people sidebar-link-icon"></i>
				<span>Operarios</span>
			</a>

			<a th:href="@{/mudanzavehiculo}" class="sidebar-link">
				<i class="bi bi-link-45deg sidebar-link-icon"></i>
				<span>Asignaciones</span>
			</a>
		</nav>

		<div class="sidebar-footer">
			<div class="d-flex align-items-center gap-2 mb-2">
				<div class="sidebar-avatar">
					<i class="bi bi-person sidebar-avatar-icon"></i>
				</div>
				<div>
					<p class="sidebar-username" sec:authentication="name"></p>
				</div>
			</div>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn-logout">
					<i class="bi bi-box-arrow-left"></i> Cerrar sesión
				</button>
			</form>
		</div>
	</div>
</body>

</html>
