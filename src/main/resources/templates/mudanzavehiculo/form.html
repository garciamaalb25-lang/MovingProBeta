<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Nueva Asignación - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<style>
		body {
			background: #F4F7FB;
			font-family: 'Segoe UI', sans-serif;
			margin: 0;
		}

		.main-content {
			margin-left: 250px;
			padding-top: 60px;
			min-height: 100vh;
		}

		.content-area {
			padding: 30px;
		}

		.page-title {
			font-size: 22px;
			font-weight: 700;
			color: #1B3A6B;
			margin-bottom: 4px;
		}

		.page-subtitle {
			color: #378ADD;
			font-size: 13px;
			margin-bottom: 24px;
		}

		.form-card {
			background: #ffffff;
			border-radius: 12px;
			border: 0.5px solid #B5D4F4;
			overflow: hidden;
		}

		.form-card-header {
			padding: 20px 24px;
			border-bottom: 0.5px solid #B5D4F4;
		}

		.form-card-body {
			padding: 24px;
		}

		.form-label {
			color: #1B3A6B;
			font-size: 13px;
			font-weight: 600;
		}

		.form-text {
			color: #378ADD;
			font-size: 11px;
		}

		.btn-guardar {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
		}

		.btn-guardar:hover {
			background: #2A5298;
			color: #E6F1FB;
		}

		.btn-cancelar {
			background: #F4F7FB;
			color: #1B3A6B;
			border: 0.5px solid #B5D4F4;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="main-content">
		<div class="content-area">
			<p class="page-title">Nueva Asignación</p>
			<p class="page-subtitle">Asignar un vehículo a una mudanza</p>

			<div class="form-card">
				<div class="form-card-header">
					<h6 style="color: #1B3A6B; font-weight: 700; margin: 0; font-size: 15px;">
						<i class="bi bi-truck me-2"></i>Datos de la asignación
					</h6>
				</div>
				<div class="form-card-body">
					<form th:action="@{/mudanzavehiculo/save}" method="post">
						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label">Mudanza</label>
								<select class="form-select" name="mudanzaId" required>
									<option value="">Selecciona una mudanza</option>
									<option th:each="mudanza : ${mudanzas}" th:value="${mudanza.idMudanza}"
										th:text="${mudanza.origen} + ' → ' + ${mudanza.destino} + ' (' + ${#temporals.format(mudanza.fecha, 'dd/MM/yyyy')} + ')'">
									</option>
								</select>
							</div>
							<div class="col-md-6">
								<label class="form-label">Vehículo disponible</label>
								<select class="form-select" name="vehiculoId" required>
									<option value="">Selecciona un vehículo</option>
									<option th:each="vehiculo : ${vehiculos}" th:value="${vehiculo.idVehiculo}"
										th:text="${vehiculo.matricula} + ' — ' + ${vehiculo.capacidad} + ' kg'">
									</option>
								</select>
							</div>
							<div class="col-md-6">
								<label class="form-label">Peso de la mudanza (kg)</label>
								<input type="number" step="0.01" min="0" class="form-control" name="pesoMudanza"
									required />
								<div class="form-text">El peso no puede superar la capacidad del vehículo</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Observaciones</label>
								<input type="text" class="form-control" name="observaciones"
									placeholder="Observaciones opcionales" />
							</div>
						</div>
						<div class="mt-4 d-flex gap-3">
							<button type="submit" class="btn-guardar">
								<i class="bi bi-check-circle me-1"></i>Guardar
							</button>
							<a th:href="@{/mudanzavehiculo}" class="btn-cancelar">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
