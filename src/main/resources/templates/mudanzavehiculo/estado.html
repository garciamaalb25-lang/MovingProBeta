<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Cambiar Estado - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<style>
		body {
			background: #F4F7FB;
			font-family: 'Segoe UI', sans-serif;
			margin: 0;
		}

		.main-content {
			margin-left: 250px;
			padding-top: 60px;
			min-height: 100vh;
		}

		.content-area {
			padding: 30px;
		}

		.page-title {
			font-size: 22px;
			font-weight: 700;
			color: #1B3A6B;
			margin-bottom: 4px;
		}

		.page-subtitle {
			color: #378ADD;
			font-size: 13px;
			margin-bottom: 24px;
		}

		.form-card {
			background: #ffffff;
			border-radius: 12px;
			border: 0.5px solid #B5D4F4;
			overflow: hidden;
		}

		.form-card-header {
			padding: 20px 24px;
			border-bottom: 0.5px solid #B5D4F4;
		}

		.form-card-body {
			padding: 24px;
		}

		.form-label {
			color: #1B3A6B;
			font-size: 13px;
			font-weight: 600;
		}

		.btn-guardar {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
		}

		.btn-guardar:hover {
			background: #2A5298;
			color: #E6F1FB;
		}

		.btn-cancelar {
			background: #F4F7FB;
			color: #1B3A6B;
			border: 0.5px solid #B5D4F4;
			padding: 10px 24px;
			border-radius: 8px;
			font-size: 14px;
			text-decoration: none;
		}

		.info-card {
			background: #F4F7FB;
			border-radius: 8px;
			padding: 16px;
			margin-bottom: 20px;
			border: 0.5px solid #B5D4F4;
		}

		.info-label {
			color: #378ADD;
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.info-value {
			color: #1B3A6B;
			font-size: 14px;
			font-weight: 600;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="main-content">
		<div class="content-area">
			<p class="page-title">Cambiar Estado</p>
			<p class="page-subtitle">Actualizar el estado de la asignación</p>

			<div class="form-card">
				<div class="form-card-header">
					<h6 style="color: #1B3A6B; font-weight: 700; margin: 0; font-size: 15px;">
						<i class="bi bi-arrow-repeat me-2"></i>Estado de la asignación
					</h6>
				</div>
				<div class="form-card-body">

					<div class="info-card">
						<div class="row g-3">
							<div class="col-md-4">
								<p class="info-label">Mudanza</p>
								<p class="info-value"
									th:text="${asignacion.mudanza.origen} + ' → ' + ${asignacion.mudanza.destino}"></p>
							</div>
							<div class="col-md-4">
								<p class="info-label">Vehículo</p>
								<p class="info-value" th:text="${asignacion.vehiculo.matricula}"></p>
							</div>
							<div class="col-md-4">
								<p class="info-label">Estado actual</p>
								<p class="info-value" th:text="${asignacion.estado}"></p>
							</div>
						</div>
					</div>

					<form th:action="@{/mudanzavehiculo/estado/{id}(id=${asignacion.idMudanzaVehiculo})}" method="post">
						<div class="mb-3">
							<label class="form-label">Nuevo estado</label>
							<select class="form-select" name="estado" required>
								<option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"
									th:selected="${estado == asignacion.estado}">
								</option>
							</select>
						</div>
						<div class="d-flex gap-3">
							<button type="submit" class="btn-guardar">
								<i class="bi bi-check-circle me-1"></i>Actualizar estado
							</button>
							<a th:href="@{/mudanzavehiculo}" class="btn-cancelar">Cancelar</a>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
