<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Error - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="centered-body">
	<div class="error-card">
		<div class="error-icon">
			<i class="bi bi-exclamation-triangle"></i>
		</div>

		<p class="error-title" th:text="${errorTitulo}">Error</p>
		<p class="error-message" th:text="${errorMensaje}">Ha ocurrido un error inesperado.</p>

		<a th:href="@{/}" class="btn-volver">
			<i class="bi bi-arrow-left me-2"></i>Volver al inicio
		</a>

		<p class="error-footer">MovingPro — Salesianos Triana</p>
	</div>
</body>

</html>
