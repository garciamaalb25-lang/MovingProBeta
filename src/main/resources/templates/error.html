<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error - MovingPro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #F4F7FB;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: #ffffff;
            border-radius: 16px;
            border: 0.5px solid #B5D4F4;
            border-top: 4px solid #A32D2D;
            padding: 50px 40px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(27,58,107,0.08);
        }

        .error-icon {
            width: 72px;
            height: 72px;
            background: #FCEBEB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .error-icon i {
            font-size: 32px;
            color: #A32D2D;
        }

        .error-title {
            font-size: 20px;
            font-weight: 700;
            color: #1B3A6B;
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 14px;
            color: #378ADD;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-volver {
            background: #1B3A6B;
            color: #E6F1FB;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background: #2A5298;
            color: #E6F1FB;
        }

        .error-footer {
            margin-top: 24px;
            font-size: 11px;
            color: #B5D4F4;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle"></i>
        </div>

        <p class="error-title" th:text="${errorTitulo}">Error</p>
        <p class="error-message" th:text="${errorMensaje}">Ha ocurrido un error inesperado.</p>

        <a th:href="@{/}" class="btn-volver">
            <i class="bi bi-arrow-left me-2"></i>Volver al inicio
        </a>

        <p class="error-footer">MovingPro — Salesianos Triana</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
