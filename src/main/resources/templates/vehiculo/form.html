<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Vehículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4">

        <h2 class="mb-4" th:text="${vehiculo.idVehiculo == null} ? 'Nuevo Vehículo' : 'Editar Vehículo'"></h2>

        <form th:action="@{/vehiculo/save}" th:object="${vehiculo}" method="post">

            <input type="hidden" th:field="*{idVehiculo}" />

            <div class="mb-3">
                <label class="form-label">Matrícula</label>
                <input type="text" class="form-control" th:field="*{matricula}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Capacidad (kg)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{capacidad}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Disponible</label>
                <select class="form-select" th:field="*{disponible}">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Coste por Hora (€)</label>
                <input type="number" step="0.01" class="form-control" th:field="*{costePorHora}" />
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/vehiculo}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
