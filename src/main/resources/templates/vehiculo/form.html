<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Vehículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4 flex-grow-1">
        <h2 class="mb-4" th:text="${vehiculo.idVehiculo == null} ? 'Nuevo Vehículo' : 'Editar Vehículo'"></h2>
        <form th:action="@{/vehiculo/save}" th:object="${vehiculo}" method="post">
            <input type="hidden" th:field="*{idVehiculo}" />
            <div class="mb-3">
                <label class="form-label">Matrícula</label>
                <input type="text" class="form-control" th:field="*{matricula}"
                       id="matricula"
                       pattern="[0-9]{4}[A-Z]{3}"
                       placeholder="Ej: 1234ABC"
                       title="4 números y 3 letras mayúsculas"
                       required
                       th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}"
                     th:errors="*{matricula}"></div>
                <div class="form-text">Formato: 4 números + 3 letras mayúsculas (ej: 1234ABC)</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Capacidad (kg)</label>
                <input type="number" step="0.01" min="100" max="30000" class="form-control" th:field="*{capacidad}"
                       required
                       th:classappend="${#fields.hasErrors('capacidad')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('capacidad')}"
                     th:errors="*{capacidad}"></div>
                <div class="form-text">Entre 100 kg y 30000 kg</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Disponible</label>
                <select class="form-select" th:field="*{disponible}">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Coste por Hora (€)</label>
                <input type="number" step="0.01" min="10" max="500" class="form-control" th:field="*{costePorHora}"
                       id="costePorHora"
                       required
                       th:classappend="${#fields.hasErrors('costePorHora')} ? 'is-invalid'" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('costePorHora')}"
                     th:errors="*{costePorHora}"></div>
                <div class="form-text">Entre 10 € y 500 € por hora</div>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/vehiculo}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/validaciones.js}"></script>
</body>
</html>
