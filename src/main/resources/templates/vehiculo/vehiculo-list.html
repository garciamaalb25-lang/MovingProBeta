<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Vehículos - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/validaciones.js}"></script>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="main-content">
		<div class="content-area">
			<p class="page-title">Vehículos</p>
			<p class="page-subtitle">Gestión de la flota de vehículos</p>
			<div class="card-table">
				<div class="card-header-custom d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-2 gap-md-0">
					<h6 class="card-header-title"><i class="bi bi-truck me-2"></i>Listado de vehículos</h6>
					<a sec:authorize="hasAnyRole('ADMIN', 'OPERADOR')" th:href="@{/vehiculo/new}" class="btn-nuevo"><i
							class="bi bi-plus-circle me-1"></i>Nuevo Vehículo</a>
				</div>
				<div class="search-area">
					<form th:action="@{/vehiculo/buscar}" method="get" class="row g-2 align-items-end">
						<div class="col-md-4">
							<label class="form-label">Estado</label>
							<select class="form-select form-select-sm" name="disponible">
								<option value="">Todos</option>
								<option value="true">Disponibles</option>
								<option value="false">No disponibles</option>
							</select>
						</div>
						<div class="col-md-4">
							<label class="form-label">Capacidad mínima (kg)</label>
							<input type="number" class="form-control form-control-sm" name="capacidadMinima" min="100"
								max="30000" />
						</div>
						<div class="col-md-4 d-flex gap-2">
							<button type="submit" class="btn-buscar">Buscar</button>
							<a th:href="@{/vehiculo}" class="btn-limpiar">Limpiar</a>
						</div>
					</form>
				</div>
				<table class="table mb-0">
					<thead>
						<tr>
							<th>Matrícula</th>
							<th>Capacidad</th>
							<th>Disponible</th>
							<th>Coste/h</th>
							<th sec:authorize="hasRole('ADMIN')">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="vehiculo : ${vehiculos}">
							<td th:text="${vehiculo.matricula}"></td>
							<td th:text="${vehiculo.capacidad} + ' kg'"></td>
							<td>
								<span th:if="${vehiculo.disponible}" class="badge-custom available">Sí</span>
								<span th:unless="${vehiculo.disponible}" class="badge-custom unavailable">No</span>
							</td>
							<td th:text="${vehiculo.costePorHora} + ' €'"></td>
							<td sec:authorize="hasRole('ADMIN')">
								<a th:href="@{/vehiculo/edit/{id}(id=${vehiculo.idVehiculo})}"
									class="btn-editar">Editar</a>
								<a th:href="@{/vehiculo/delete/{id}(id=${vehiculo.idVehiculo})}"
									class="btn-eliminar-custom btn-eliminar ms-1">Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(vehiculos)}">
							<td colspan="5" class="table-empty-msg">No hay vehículos registrados</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<div class="modal fade" id="modalConfirmar" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header modal-header-custom">
					<h5 class="modal-title modal-title-custom"><i
							class="bi bi-exclamation-triangle text-warning me-2"></i>Confirmar eliminación</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">¿Estás seguro de que quieres eliminar este registro?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/navbar :: mobilenav}"></div>
</body>

</html>
