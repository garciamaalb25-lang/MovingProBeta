<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Vehículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-4 flex-grow-1">
        <h2 class="mb-4">Listado de Vehículos</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehiculo/new}" class="btn btn-primary mb-3">Nuevo Vehículo</a>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Matrícula</th>
                    <th>Capacidad</th>
                    <th>Disponible</th>
                    <th>Coste por Hora</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vehiculo : ${vehiculos}">
                    <td th:text="${vehiculo.matricula}"></td>
                    <td th:text="${vehiculo.capacidad} + ' kg'"></td>
                    <td>
                        <span th:if="${vehiculo.disponible}" class="badge bg-success">Disponible</span>
                        <span th:unless="${vehiculo.disponible}" class="badge bg-danger">No disponible</span>
                    </td>
                    <td th:text="${vehiculo.costePorHora} + ' €/h'"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/vehiculo/edit/{id}(id=${vehiculo.idVehiculo})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/vehiculo/delete/{id}(id=${vehiculo.idVehiculo})}"
                           class="btn btn-danger btn-sm btn-eliminar">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="modalConfirmar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-danger">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle text-danger"></i> Confirmar eliminación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que quieres eliminar este registro? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/validaciones.js}"></script>
</body>
</html>
