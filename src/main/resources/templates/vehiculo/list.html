<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Vehículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4">

        <h2 class="mb-4">Listado de Vehículos</h2>

        <a th:href="@{/vehiculo/new}" class="btn btn-primary mb-3">Nuevo Vehículo</a>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Matrícula</th>
                    <th>Capacidad</th>
                    <th>Disponible</th>
                    <th>Coste por Hora</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="vehiculo : ${vehiculos}">
                    <td th:text="${vehiculo.matricula}"></td>
                    <td th:text="${vehiculo.capacidad} + ' kg'"></td>
                    <td>
                        <span th:if="${vehiculo.disponible}" class="badge bg-success">Disponible</span>
                        <span th:unless="${vehiculo.disponible}" class="badge bg-danger">No disponible</span>
                    </td>
                    <td th:text="${vehiculo.costePorHora} + ' €/h'"></td>
                    <td>
                        <a th:href="@{/vehiculo/edit/{id}(id=${vehiculo.idVehiculo})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/vehiculo/delete/{id}(id=${vehiculo.idVehiculo})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar este vehículo?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>	

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
