<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Vehículos - MovingPro</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<style>
		body {
			background: #F4F7FB;
			font-family: 'Segoe UI', sans-serif;
			margin: 0;
		}

		.main-content {
			margin-left: 250px;
			padding-top: 60px;
			min-height: 100vh;
		}

		.content-area {
			padding: 30px;
		}

		.page-title {
			font-size: 22px;
			font-weight: 700;
			color: #1B3A6B;
			margin-bottom: 4px;
		}

		.page-subtitle {
			color: #378ADD;
			font-size: 13px;
			margin-bottom: 24px;
		}

		.card-table {
			background: #ffffff;
			border-radius: 12px;
			border: 0.5px solid #B5D4F4;
			overflow: hidden;
		}

		.card-header-custom {
			padding: 20px 24px;
			border-bottom: 0.5px solid #B5D4F4;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.search-area {
			padding: 16px 24px;
			background: #F4F7FB;
			border-bottom: 0.5px solid #B5D4F4;
		}

		.search-area label {
			color: #1B3A6B;
			font-size: 12px;
			font-weight: 600;
		}

		table thead th {
			background: #F4F7FB;
			color: #1B3A6B;
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 1px;
			border: none;
			padding: 12px 16px;
		}

		table tbody td {
			padding: 12px 16px;
			font-size: 14px;
			border-bottom: 0.5px solid #F4F7FB;
		}

		table tbody tr:hover {
			background: #F4F7FB;
		}

		.btn-editar {
			background: #FAEEDA;
			color: #854F0B;
			border: none;
			font-size: 12px;
			padding: 4px 12px;
			border-radius: 6px;
			text-decoration: none;
		}

		.btn-eliminar-custom {
			background: #FCEBEB;
			color: #A32D2D;
			border: none;
			font-size: 12px;
			padding: 4px 12px;
			border-radius: 6px;
			cursor: pointer;
		}

		.btn-nuevo {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			font-size: 13px;
			padding: 8px 18px;
			border-radius: 8px;
			text-decoration: none;
		}

		.btn-nuevo:hover {
			background: #2A5298;
			color: #E6F1FB;
		}

		.btn-buscar {
			background: #1B3A6B;
			color: #E6F1FB;
			border: none;
			padding: 6px 16px;
			border-radius: 6px;
			font-size: 13px;
		}

		.btn-limpiar {
			background: #ffffff;
			color: #1B3A6B;
			border: 0.5px solid #B5D4F4;
			padding: 6px 16px;
			border-radius: 6px;
			font-size: 13px;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="main-content">
		<div class="content-area">
			<p class="page-title">Vehículos</p>
			<p class="page-subtitle">Gestión de la flota de vehículos</p>
			<div class="card-table">
				<div class="card-header-custom">
					<h6 style="color: #1B3A6B; font-weight: 700; margin: 0; font-size: 15px;"><i
							class="bi bi-truck me-2"></i>Listado de vehículos</h6>
					<a sec:authorize="hasAnyRole('ADMIN', 'OPERADOR')" th:href="@{/vehiculo/new}" class="btn-nuevo"><i
							class="bi bi-plus-circle me-1"></i>Nuevo Vehículo</a>
				</div>
				<div class="search-area">
					<form th:action="@{/vehiculo/buscar}" method="get" class="row g-2 align-items-end">
						<div class="col-md-4">
							<label class="form-label">Estado</label>
							<select class="form-select form-select-sm" name="disponible">
								<option value="">Todos</option>
								<option value="true">Disponibles</option>
								<option value="false">No disponibles</option>
							</select>
						</div>
						<div class="col-md-4">
							<label class="form-label">Capacidad mínima (kg)</label>
							<input type="number" class="form-control form-control-sm" name="capacidadMinima" min="100"
								max="30000" />
						</div>
						<div class="col-md-4 d-flex gap-2">
							<button type="submit" class="btn-buscar">Buscar</button>
							<a th:href="@{/vehiculo}" class="btn-limpiar">Limpiar</a>
						</div>
					</form>
				</div>
				<table class="table mb-0">
					<thead>
						<tr>
							<th>Matrícula</th>
							<th>Capacidad</th>
							<th>Disponible</th>
							<th>Coste/h</th>
							<th sec:authorize="hasRole('ADMIN')">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="vehiculo : ${vehiculos}">
							<td th:text="${vehiculo.matricula}"></td>
							<td th:text="${vehiculo.capacidad} + ' kg'"></td>
							<td>
								<span th:if="${vehiculo.disponible}"
									style="background: #E1F5EE; color: #085041; font-size: 11px; padding: 3px 10px; border-radius: 20px;">Sí</span>
								<span th:unless="${vehiculo.disponible}"
									style="background: #FCEBEB; color: #A32D2D; font-size: 11px; padding: 3px 10px; border-radius: 20px;">No</span>
							</td>
							<td th:text="${vehiculo.costePorHora} + ' €'"></td>
							<td sec:authorize="hasRole('ADMIN')">
								<a th:href="@{/vehiculo/edit/{id}(id=${vehiculo.idVehiculo})}"
									class="btn-editar">Editar</a>
								<a th:href="@{/vehiculo/delete/{id}(id=${vehiculo.idVehiculo})}"
									class="btn-eliminar-custom btn-eliminar ms-1">Eliminar</a>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(vehiculos)}">
							<td colspan="5" style="text-align: center; color: #B5D4F4; padding: 24px;">No hay vehículos
								registrados</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<div class="modal fade" id="modalConfirmar" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header" style="background: #1B3A6B;">
					<h5 class="modal-title" style="color: #E6F1FB;"><i
							class="bi bi-exclamation-triangle text-warning me-2"></i>Confirmar eliminación</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">¿Estás seguro de que quieres eliminar este registro?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/navbar :: mobilenav}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/validaciones.js}"></script>
</body>

</html>
