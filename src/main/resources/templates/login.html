<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>MovingPro - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #111111;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 5px;
        }

        .login-title span {
            color: #e53935;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .form-control {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .form-control:focus {
            background: #1a1a1a;
            border-color: #e53935;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(229, 57, 53, 0.25);
        }

        .form-label {
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login {
            background: linear-gradient(90deg, #e53935, #ff7043);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            width: 100%;
            color: white;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }

        .error-msg {
            background: rgba(229, 57, 53, 0.1);
            border: 1px solid #e53935;
            border-radius: 10px;
            padding: 12px;
            color: #e53935;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">

            <div class="login-title">MOVING<span>PRO</span></div>
            <div class="login-subtitle">Sistema de gestión</div>

            <!-- Mensaje de error -->
            <div class="error-msg" th:if="${param.error}">
                Usuario o contraseña incorrectos
            </div>

            <!-- Mensaje de logout -->
            <div class="error-msg" style="border-color: #4caf50; color: #4caf50; background: rgba(76,175,80,0.1);"
                th:if="${param.logout}">
                Has cerrado sesión correctamente
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" name="username" placeholder="Introduce tu usuario" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" name="password" placeholder="Introduce tu contraseña" />
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
